version: '3.8'
services:
  backend:
    build: ./backend
    container_name: sodai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - sodai-net

  frontend:
    build: ./frontend
    container_name: sodai-frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://backend:8000/predict/
    depends_on:
      - backend
    networks:
      - sodai-net

networks:
  sodai-net:
    driver: bridge